<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <main class="main-container">
        <header class="input-container">
            <input class="city-input" placeholder="Search City" type="text">
            <button class="search-btn">
                <span class="material-symbols-outlined">
                    search
                </span>
            </button>
        </header>

        <section class="weather-info" style="display: none;">
            <div class="location-date-container">
                <div class="location">
                    <span class="material-symbols-outlined">
                        location_on
                    </span>
                    <h4 class="country-txt">hyderabad</h4>
                </div>
                <h5 class="current-date-txt regular-text">Tue, 22 Apr</h5>
            </div>
            <div class="weather-summary-container">
                <img src="weather/clouds.svg" class="weather-summary-img">
                <div class="weather-summary-info">
                    <h1 class="temp-text">29°C</h1>
                    <h3 class="condition-text regular-text">Clouds</h3>
                </div>
            </div>
            <div class="weather-conditions-container">
                <div class="condition-item">
                    <span class="material-symbols-outlined">
                        water_drop
                    </span>
                    <div class="condition-info">
                        <h5 class="regular-txt">Humidity</h5>
                        <h5 class="humiditiy-value-txt">55%</h5>
                    </div>
                </div>
                <div class="condition-item">
                    <span class="material-symbols-outlined">
                        air
                    </span>
                    <div class="condition-info">
                        <h5 class="regular-txt">Wind speed</h5>
                        <h5 class="wind-value-txt">2 M/s</h5>
                    </div>
                </div>
            </div>
            <div class="forecast-items-container">
                <div class="forecast-item">
                    <div class="forecast-item-date regular-text">22 Apr</div>
                    <img src="weather/thunderstorm.svg" class="forecast-item-img">
                    <h5 class="forecast-item-temp">29°C</h5>
                </div>
                <div class="forecast-item">
                    <div class="forecast-item-date regular-text">22 Apr</div>
                    <img src="weather/clouds.svg" class="forecast-item-img">
                    <h5 class="forecast-item-temp">29°C</h5>
                </div>
                <div class="forecast-item">
                    <div class="forecast-item-date regular-text">22 Apr</div>
                    <img src="weather/clouds.svg" class="forecast-item-img">
                    <h5 class="forecast-item-temp">29°C</h5>
                </div>
            </div>
        </section>
        <section class="search-city section-message">
            <img src="message/search-city.png" alt="Search city"> 
            <div>
                <h1>Search city</h1>
                <h4 class="regular-txt">
                    Find out the Weather conditions of the city
                </h4>
            </div>
        </section>
        
        <section class="not-found section-message" style="display: none;">
            <img src="message/not-found.png" alt="City not found"> 
            <div>
                <h1>City Not Found</h1> <!-- Changed text to be different -->
                <h4 class="regular-txt">
                    Please try another city name
                </h4>
            </div>
        </section>
    </main>
</body>
</html>
